name: Test and deploy web game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run project checks
        run: node scripts/check-project.mjs
      - name: Run automated tests
        run: node --test tests/*.test.mjs
      - name: Prepare minimal website bundle
        run: node scripts/prepare-site.mjs && test -f dist/index.html
      - name: Upload tested website bundle
        uses: actions/upload-artifact@v4
        with:
          name: tested-site-bundle
          path: dist
          if-no-files-found: error
          retention-days: 1
      - name: Verify Android web asset preparation
        run: node scripts/prepare-android.mjs && test -f www/index.html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download tested website bundle
        uses: actions/download-artifact@v4
        with:
          name: tested-site-bundle
          path: dist
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy only after tests pass
        id: deployment
        uses: actions/deploy-pages@v4

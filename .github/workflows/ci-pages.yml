name: Test and deploy web game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run project checks
        run: node scripts/check-project.mjs
      - name: Run automated tests
        run: node --test tests/*.test.mjs
      - name: Prepare minimal website bundle
        run: node scripts/prepare-site.mjs && test -f dist/index.html && test -f dist/timeline.html && test -f dist/vendor/three.module.js && test -f dist/vendor/addons/controls/OrbitControls.js && test -f dist/vendor/THREE-LICENSE.txt
      - name: Upload tested website bundle
        uses: actions/upload-artifact@v4
        with:
          name: tested-site-bundle
          path: dist
          if-no-files-found: error
          retention-days: 1
      - name: Verify Android web asset preparation
        run: node scripts/prepare-android.mjs && test -f www/index.html && test -f www/timeline.html && test -f www/vendor/three.module.js && test -f www/vendor/addons/controls/OrbitControls.js && test -f www/vendor/THREE-LICENSE.txt

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download tested website bundle
        uses: actions/download-artifact@v4
        with:
          name: tested-site-bundle
          path: dist
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy only after tests pass
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test deployed 3D page and local assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          curl --fail --silent --show-error --retry 10 --retry-delay 5 "$base/timeline.html" -o /tmp/timeline.html
          grep -F '"three":"./vendor/three.module.js"' /tmp/timeline.html
          curl --fail --silent --show-error "$base/vendor/three.module.js" -o /dev/null
          curl --fail --silent --show-error "$base/vendor/addons/controls/OrbitControls.js" -o /dev/null
          curl --fail --silent --show-error "$base/vendor/THREE-LICENSE.txt" -o /dev/null
          echo "Deployed 3D page and local Three.js assets are reachable."

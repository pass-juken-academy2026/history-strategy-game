name: Android package (unsigned release candidate)

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install JavaScript dependencies
        run: npm install
      - name: Prepare app assets
        run: npm run prepare:android
      - name: Generate Capacitor Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Build Android bundle candidate
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Upload unsigned AAB candidate
        uses: actions/upload-artifact@v4
        with:
          name: history-strategy-unsigned-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
